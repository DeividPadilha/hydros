name: HYDROS APS R10 - DSSAT development only
"on":
  push:
    branches: [aps-r10-campanha-piloto-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dssat-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran cmake
      - name: Acquire immutable official sources
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/DSSAT/dssat-csm-os.git os
          git -C os checkout -q --detach d6556cca9f926c40eddffd9adcf77e970db7511b
          git clone -q https://github.com/DSSAT/dssat-csm-data.git data
          git -C data checkout -q --detach 6f83f1f0197c3e0afee5467a2a4a77249e27a6de
          test "$(git -C os rev-parse HEAD)" = d6556cca9f926c40eddffd9adcf77e970db7511b
          test "$(git -C data rev-parse HEAD)" = 6f83f1f0197c3e0afee5467a2a4a77249e27a6de
          echo "engine_sha=$(git -C os rev-parse HEAD)" > source_manifest.txt
          echo "data_sha=$(git -C data rev-parse HEAD)" >> source_manifest.txt
      - name: Compile DSSAT 4.8.6
        run: |
          set -euo pipefail
          mkdir -p DSSAT48 logs
          cmake -S os -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/DSSAT48" > logs/cmake.log 2>&1
          cmake --build build -j 2 > logs/compile.log 2>&1
          cmake --install build > logs/install.log 2>&1
      - name: Run original scientific DEV experiments only
        shell: bash
        run: |
          set -euo pipefail
          cp -a os/Data/. DSSAT48/
          cp -a data/. DSSAT48/
          exe="$(find "$PWD/DSSAT48" "$PWD/build" -type f -name dscsm048 -print -quit)"
          test -n "$exe"
          mkdir -p runs
          printf 'experiment,filex_sha256,plantgro_sha256,soilwat_sha256,weather_sha256\n' > execution_sources.csv
          for ex in UFGA7802 UFGA7902 UFGA8101 IUAM8801; do
            echo "DEV_EXPLORATORIO_NAO_HOMOLOGADO $ex"
            ( cd DSSAT48/Soybean && rm -f -- ./*.OUT && "$exe" A "$ex.SBX" ) > "runs/$ex.stdout" 2>"runs/$ex.stderr"
            for fn in PlantGro.OUT SoilWat.OUT Weather.OUT; do
              test -s "DSSAT48/Soybean/$fn"
            done
            mkdir "runs/$ex"
            cp DSSAT48/Soybean/*.OUT "runs/$ex/"
            printf '%s,%s,%s,%s,%s\n' "$ex" "$(sha256sum "DSSAT48/Soybean/$ex.SBX" | cut -d' ' -f1)" "$(sha256sum "runs/$ex/PlantGro.OUT" | cut -d' ' -f1)" "$(sha256sum "runs/$ex/SoilWat.OUT" | cut -d' ' -f1)" "$(sha256sum "runs/$ex/Weather.OUT" | cut -d' ' -f1)" >> execution_sources.csv
          done
          sha256sum "$exe" > engine_binary.sha256
          find runs -type f -exec sha256sum {} + | sort > outputs.sha256
          echo "DEV_ONLY_NOT_APPROVED_FOR_G3_G4" > STATUS.txt
      - name: UFGA7802 daily output cadence technical amendment only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path=Path("DSSAT48/Soybean/UFGA7802.SBX")
          original=path.read_bytes()
          text=original.decode("latin-1")
          lines=text.splitlines(keepends=True)
          header_ix=[i for i,v in enumerate(lines) if v.startswith("@N OUTPUTS")]
          assert len(header_ix)==1,header_ix
          idx=header_ix[0]+1
          original_line=lines[idx]
          assert "     Y     Y     3     Y" in original_line,repr(original_line)
          amended=original_line.replace("     Y     Y     3     Y","     Y     Y     1     Y",1)
          assert len(amended)==len(original_line)
          lines[idx]=amended
          updated="".join(lines).encode("latin-1")
          assert updated!=original
          path.write_bytes(updated)
          Path("runs/UFGA7802_FROPT_EDIT.txt").write_text(
            "Technical only: FROPT 3 to 1; no agronomic parameters changed.\n"
            + "original_filex_sha256="+hashlib.sha256(original).hexdigest()+"\n"
            + "modified_filex_sha256="+hashlib.sha256(updated).hexdigest()+"\n"
            + "before="+original_line.strip()+"\n"
            + "after="+amended.strip()+"\n"
          )
          PY
          exe="$(find "$PWD/DSSAT48" "$PWD/build" -type f -name dscsm048 -print -quit)"
          ( cd DSSAT48/Soybean && rm -f -- ./*.OUT && "$exe" A UFGA7802.SBX ) > runs/UFGA7802_DAILY.stdout 2>runs/UFGA7802_DAILY.stderr
          for fn in PlantGro.OUT SoilWat.OUT Weather.OUT Summary.OUT; do test -s "DSSAT48/Soybean/$fn"; done
          mkdir runs/UFGA7802_DAILY
          cp DSSAT48/Soybean/*.OUT runs/UFGA7802_DAILY/
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          originals=Path("runs/UFGA7802")
          altered=Path("runs/UFGA7802_DAILY")
          def rows(path):
              s=path.read_text(encoding="latin-1")
              return len(re.findall(r"(?m)^\s*1978\s+\d{3}\s+",s))
          sizes={name:{"original_n":rows(originals/name),"daily_n":rows(altered/name)} for name in ("PlantGro.OUT","SoilWat.OUT","Weather.OUT")}
          a=(originals/"Summary.OUT").read_bytes()
          b=(altered/"Summary.OUT").read_bytes()
          report={"frequency_change_FROPT":"3_to_1","daily_rows":sizes,
                  "summary_byte_equal":a==b,
                  "sha256_original_summary":hashlib.sha256(a).hexdigest(),
                  "sha256_daily_summary":hashlib.sha256(b).hexdigest(),
                  "status":"OUTPUT_FORMAT_VERIFICATION_REQUIRED"}
          Path("runs/UFGA7802_FROPT_CHECK.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Save logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aps-r10-dev-outputs
          path: |
            runs/
            logs/
            source_manifest.txt
            execution_sources.csv
            outputs.sha256
            engine_binary.sha256
            STATUS.txt
          retention-days: 7
