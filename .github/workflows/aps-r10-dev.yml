name: HYDROS APS R14 - Lugo rainfed daily output fix DEV only
"on":
  push:
    branches: [aps-r14-dev-lugo-daily-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dssat-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran cmake
      - name: Acquire immutable official sources
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/DSSAT/dssat-csm-os.git os
          git -C os checkout -q --detach d6556cca9f926c40eddffd9adcf77e970db7511b
          git clone -q https://github.com/DSSAT/dssat-csm-data.git data
          git -C data checkout -q --detach 6f83f1f0197c3e0afee5467a2a4a77249e27a6de
          test "$(git -C os rev-parse HEAD)" = d6556cca9f926c40eddffd9adcf77e970db7511b
          test "$(git -C data rev-parse HEAD)" = 6f83f1f0197c3e0afee5467a2a4a77249e27a6de
          echo "engine_sha=$(git -C os rev-parse HEAD)" > source_manifest.txt
          echo "data_sha=$(git -C data rev-parse HEAD)" >> source_manifest.txt
      - name: Compile DSSAT 4.8.6
        run: |
          set -euo pipefail
          mkdir -p DSSAT48 logs
          cmake -S os -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/DSSAT48" > logs/cmake.log 2>&1
          cmake --build build -j 2 > logs/compile.log 2>&1
          cmake --install build > logs/install.log 2>&1
      - name: Run original scientific DEV experiments only
        shell: bash
        run: |
          set -euo pipefail
          cp -a os/Data/. DSSAT48/
          cp -a data/. DSSAT48/
          exe="$(find "$PWD/DSSAT48" "$PWD/build" -type f -name dscsm048 -print -quit)"
          test -n "$exe"
          mkdir -p runs
          printf 'experiment,filex_sha256,plantgro_sha256,soilwat_sha256,weather_sha256\n' > execution_sources.csv
          for ex in LUGO9801 LUGO9802; do
            echo "DEV_EXPLORATORIO_NAO_HOMOLOGADO $ex"
            ( cd DSSAT48/Soybean && rm -f -- ./*.OUT && "$exe" A "$ex.SBX" ) > "runs/$ex.stdout" 2>"runs/$ex.stderr"
            for fn in PlantGro.OUT SoilWat.OUT Weather.OUT; do
              test -s "DSSAT48/Soybean/$fn"
            done
            mkdir "runs/$ex"
            cp DSSAT48/Soybean/*.OUT "runs/$ex/"
            printf '%s,%s,%s,%s,%s\n' "$ex" "$(sha256sum "DSSAT48/Soybean/$ex.SBX" | cut -d' ' -f1)" "$(sha256sum "runs/$ex/PlantGro.OUT" | cut -d' ' -f1)" "$(sha256sum "runs/$ex/SoilWat.OUT" | cut -d' ' -f1)" "$(sha256sum "runs/$ex/Weather.OUT" | cut -d' ' -f1)" >> execution_sources.csv
          done
          sha256sum "$exe" > engine_binary.sha256
          find runs -type f -exec sha256sum {} + | sort > outputs.sha256
          echo "DEV_ONLY_NOT_APPROVED_FOR_G3_G4" > STATUS.txt
      - name: Reproduce LUGO9802 with daily output only (FROPT=1)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          path=Path("DSSAT48/Soybean/LUGO9802.SBX")
          old=path.read_bytes()
          lines=old.decode('latin-1').splitlines(keepends=True)
          is_= [i for i,l in enumerate(lines) if l.startswith("@N OUTPUTS")]
          assert len(is_)==2,(len(is_),is_)
          substitutions=[]
          for i in is_:
            idx=i+1
            line=lines[idx]
            before=line.split()
            assert before[0].isdigit() and before[1]=="OU" and before[5]=="3", before
            after=before.copy();after[5]="1"
            # Only the FROPT output frequency field is modified, retain line length/positions.
            frag="     Y     Y     3     Y"
            assert frag in line,repr(line)
            new=line.replace(frag,"     Y     Y     1     Y",1)
            assert len(new)==len(line)
            assert new.split()[5]=="1"
            lines[idx]=new
            substitutions.append({"before":line.rstrip(),"after":new.rstrip()})
          newer="".join(lines).encode('latin-1')
          assert newer!=old
          path.write_bytes(newer)
          Path("runs/LUGO9802_cadence_metadata.json").write_text(json.dumps({
             "source_file":"Soybean/LUGO9802.SBX",
             "amendment":"technical reporting cadence only FROPT=3 to 1; all agronomic parameters intact",
             "original_sha256":hashlib.sha256(old).hexdigest(),
             "amended_sha256":hashlib.sha256(newer).hexdigest(),
             "line_changes":substitutions
           },indent=2))
          PY
          exe="$(find "$PWD/DSSAT48" "$PWD/build" -type f -name dscsm048 -print -quit)"
          ( cd DSSAT48/Soybean && rm -f -- ./*.OUT && "$exe" A LUGO9802.SBX ) > runs/LUGO9802_DAILY.stdout 2>runs/LUGO9802_DAILY.stderr
          for fn in PlantGro.OUT SoilWat.OUT Weather.OUT Summary.OUT; do test -s "DSSAT48/Soybean/$fn"; done
          mkdir -p runs/LUGO9802_DAILY
          cp DSSAT48/Soybean/*.OUT runs/LUGO9802_DAILY/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          a=Path("runs/LUGO9802/Summary.OUT").read_text(encoding="latin-1")
          b=Path("runs/LUGO9802_DAILY/Summary.OUT").read_text(encoding="latin-1")
          # timestamp lines are generated when DSSAT runs; compare the scientific non-timestamp body.
          def canonical(s):
             return [line for line in s.splitlines() if not line.startswith("!  ")
                     and not line.startswith("! File generated")]
          x,y=canonical(a),canonical(b)
          first_difference=next((i for i,(u,v) in enumerate(zip(x,y)) if u!=v),None)
          r={"summary_exact_file_bytes":a==b, "summary_lines_equal_without_only_comments": x==y,
             "first_difference":first_difference,"summary_original_sha256":hashlib.sha256(a.encode('latin-1')).hexdigest(),
             "summary_daily_sha256":hashlib.sha256(b.encode('latin-1')).hexdigest(),
             "evaluation":"Do not treat as G4 or train before scientific eligibility review"}
          Path("runs/LUGO9802_FROPT_COMPARISON.json").write_text(json.dumps(r,indent=2))
          print(json.dumps(r,indent=2))
          PY
      - name: Save logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aps-r10-dev-outputs
          path: |
            runs/
            logs/
            source_manifest.txt
            execution_sources.csv
            outputs.sha256
            engine_binary.sha256
            STATUS.txt
          retention-days: 7
